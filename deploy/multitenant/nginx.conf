# Single-host synthetic reference. Only nginx is published by Compose.
# Preserve the public Host for explicit direct-alias tenant resolution. Public
# selector/proxy headers are not accepted as identity from arbitrary clients.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:1337; }
  upstream realtime { server realtime:1339; }
  upstream ui { server ui:1340; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded '';
    proxy_set_header X-Forwarded-Host '';
    proxy_set_header X-Forwarded-For '';
    proxy_set_header X-Forwarded-Proto '';
    proxy_set_header X-Original-Host '';
    proxy_set_header X-Internal-Name '';
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    # No public management/operator/control-plane routes in this demonstration.
    location = /healthz { return 404; }
    location = /admin { return 404; }
    location ^~ /api/v1/tenant { return 404; }
    location ^~ /api/v1/operator { return 404; }
    location = /api { proxy_pass http://api; }
    location ^~ /api/ { proxy_pass http://api; }
    location = /socket.io { return 308 /socket.io/; }
    location ^~ /socket.io/ {
      # Preserve Engine.IO polling, upgrades and Socket.IO alarm namespaces.
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Forwarded '';
      proxy_set_header X-Forwarded-Host '';
      proxy_set_header X-Forwarded-For '';
      proxy_set_header X-Forwarded-Proto '';
      proxy_set_header X-Original-Host '';
      proxy_set_header X-Internal-Name '';
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_pass http://realtime;
    }
    location / {
      # Pages/assets need presentation identity, not API credentials or cookies.
      # Repeat selector stripping here because nginx inherits proxy_set_header
      # only when a location defines none of its own.
      proxy_set_header Host $http_host;
      proxy_set_header Authorization '';
      proxy_set_header api-secret '';
      proxy_set_header Cookie '';
      proxy_set_header Forwarded '';
      proxy_set_header X-Forwarded-Host '';
      proxy_set_header X-Forwarded-For '';
      proxy_set_header X-Forwarded-Proto '';
      proxy_set_header X-Original-Host '';
      proxy_set_header X-Internal-Name '';
      proxy_pass http://ui;
    }
  }
}
